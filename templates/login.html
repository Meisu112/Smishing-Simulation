<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBZ Mobile Login</title>
    <style>
        body {
            margin: 0;
            background-color: #f0f4f7;
            font-family: 'Segoe UI', sans-serif;
        }

        .mobile-frame {
            width: 360px;
            margin: 50px auto;
            border: 1px solid #ccc;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            background-color: #ffffff;
            overflow: hidden;
        }

        .header {
            background-color: #0047AB;
            color: white;
            text-align: center;
            padding: 20px 10px;
            font-size: 20px;
        }

        .logo {
            text-align: center;
            margin: 20px 0 10px;
        }

        .logo img {
            width: 80px;
        }

        .form-container {
            padding: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background-color: #0047AB;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #003380;
        }

        .back-btn {
            background-color: #e0e0e0;
            color: #333;
            margin-top: 10px;
        }

        .back-btn:hover {
            background-color: #ccc;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: gray;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="mobile-frame">
        <div class="header">KBZ Mobile Login</div>



        <div class="form-container">
            <form method="POST" action="/login">
                <label for="username">Username </label>
                <input type="text" id="username" name="username" >

                <label for="password">Password</label>
                <input type="password" id="password" name="password"  >

                <button type="submit">Login</button>
            </form>

            <form action="/">
                <button type="submit" class="back-btn">← Back</button>
            </form>
        </div>

        <div class="footer">KBZ Bank © 2025</div>
    </div>
</body>
</html>
